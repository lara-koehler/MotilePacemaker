# Parameter-scan sweep spec, consumed by python/scripts/generate_param_scan.py.
#
# base_config is resolved relative to this file's own directory.
# repeats: each (b, I0) combination below is run this many times, with a
# different random seed/initial condition each time (run_scan.jl seeds every
# run from its line number, so identical parameter rows diverge automatically
# -- no need to vary anything else by hand). 8 x 6 x 3 = 144 simulations total.

base_config = "../wave.toml"
repeats = 3

[[sweep]]
key = "chemistry.b"
values = [0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2]

[[sweep]]
key = "chemistry.I0"
values = [-2, -1.5, -1, -0.5, 0, 0.5]
