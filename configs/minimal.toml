# Minimal-model example run. Parameters are placeholders carried over from an
# earlier Python prototype for pipeline validation, not tuned/final values.

[grid]
L = 1.0
nx = 100
ny = 100

[time]
dt = 0.0001
n_steps = 20000
save_every = 200
seed = 1

[chemistry]
tau_u = 1.0
tau_v = 12.5      # 1 / epsilon, epsilon = 0.08 in the prototype
a = 0.2
b = 0.2
I0 = -1.6         # excitable / non-oscillatory background
Du = 0.001
Dv = 0.0

[coupling]
pacemaker_strength = 2.0
pacemaker_width = 0.05

[mechanics]
mobility = 0.1
sigma = 0.01
epsilon_LJ = 1.0
interaction_strength = 0.1
interaction_range = 0.2
u_threshold = 0.0
reciprocity = "nonreciprocal"

[noise]
field_sigma_u = 0.0
field_sigma_v = 0.0
position_sigma = 0.0

[sources]
n_sources = 10
arrangement = "line"
line_spacing = 0.08
line_x0 = 0.5
line_y0 = 0.5
