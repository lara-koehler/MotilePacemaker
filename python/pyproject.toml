[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motilepacemaker"
version = "0.1.0"
description = "Analysis and plotting for the motile-pacemaker mechanochemical model"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "tomli; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["motilepacemaker*"]
